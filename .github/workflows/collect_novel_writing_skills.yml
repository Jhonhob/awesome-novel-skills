name: Collect Novel Writing Agent Skills

on:
  schedule:
    # Run every week on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      min_stars:
        description: 'Minimum number of stars for repositories'
        required: false
        default: '1'
        type: string
      languages:
        description: 'Programming languages to filter (comma-separated)'
        required: false
        default: 'Python,JavaScript,TypeScript,Jupyter Notebook'
        type: string
      include_issues:
        description: 'Include issues in search'
        required: false
        default: 'true'
        type: boolean
      include_topics:
        description: 'Include topics in search'
        required: false
        default: 'true'
        type: boolean

jobs:
  collect-skills:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run collection script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse input parameters
          MIN_STARS=${{ github.event.inputs.min_stars || '1' }}
          LANGUAGES=${{ github.event.inputs.languages || 'Python JavaScript TypeScript Jupyter Notebook' }}
          INCLUDE_ISSUES=${{ github.event.inputs.include_issues || 'true' }}
          INCLUDE_TOPICS=${{ github.event.inputs.include_topics || 'true' }}
          
          # Convert comma-separated languages to space-separated
          LANGUAGES_ARG=$(echo $LANGUAGES | tr ',' ' ')
          
          # Build command arguments
          ARGS="--github-actions-mode --min-stars $MIN_STARS --languages $LANGUAGES_ARG"
          
          if [ "$INCLUDE_ISSUES" = "false" ]; then
            ARGS="$ARGS --no-issues"
          fi
          
          if [ "$INCLUDE_TOPICS" = "false" ]; then
            ARGS="$ARGS --no-topics"
          fi
          
          echo "Running with arguments: $ARGS"
          python collect_novel_writing_skills.py $ARGS
      
      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-writing-skills-json
          path: output/*.json
          retention-days: 30
      
      - name: Upload Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-writing-skills-markdown
          path: output/*.md
          retention-days: 30
      
      - name: Create summary
        run: |
          echo "## Novel Writing Agent Skills Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Collection completed at:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output Files" >> $GITHUB_STEP_SUMMARY
          echo "- JSON data: See artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Markdown report: See artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Search Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- English queries: 20" >> $GITHUB_STEP_SUMMARY
          echo "- Chinese queries: 20" >> $GITHUB_STEP_SUMMARY
          echo "- French queries: 10" >> $GITHUB_STEP_SUMMARY
          echo "- German queries: 10" >> $GITHUB_STEP_SUMMARY
          echo "- Spanish queries: 10" >> $GITHUB_STEP_SUMMARY
          echo "- Italian queries: 10" >> $GITHUB_STEP_SUMMARY
          echo "- Portuguese queries: 10" >> $GITHUB_STEP_SUMMARY
          echo "- Russian queries: 10" >> $GITHUB_STEP_SUMMARY
          echo "- Japanese queries: 10" >> $GITHUB_STEP_SUMMARY
          echo "- Korean queries: 10" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: 120 search queries across 10 languages**" >> $GITHUB_STEP_SUMMARY
